services:
  tablosync:
    build: .
    container_name: tablosync
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${TABLOSYNC_PORT:-5004}:${TABLOSYNC_PORT:-5004}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('TABLOSYNC_PORT', '5004') + '/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  tablosync-tve:
    profiles: [tve]
    build: .
    container_name: tablosync-tve
    command: tablosync-tve
    restart: unless-stopped
    environment:
      TABLOSYNC_TVE_PORT: "5005"
      TABLOSYNC_TVE_STATE_FILE: /data/fox-auth.json
      TABLOSYNC_TVE_ADVERTISE_URL: ${TABLOSYNC_TVE_ADVERTISE_URL:-}
      TABLOSYNC_TVE_BTN_GUIDE_NUMBER: ${TABLOSYNC_TVE_BTN_GUIDE_NUMBER:-6100}
      TABLOSYNC_TVE_FRIENDLY_NAME: ${TABLOSYNC_TVE_FRIENDLY_NAME:-TabloSync TV Everywhere}
      TABLOSYNC_TVE_TUNER_COUNT: ${TABLOSYNC_TVE_TUNER_COUNT:-1}
      TABLOSYNC_TVE_AUTH_UI: ${TABLOSYNC_TVE_AUTH_UI:-true}
      TABLOSYNC_TVE_FFMPEG_PATH: ${TABLOSYNC_TVE_FFMPEG_PATH:-ffmpeg}
    ports:
      - "${TABLOSYNC_TVE_PORT:-5005}:5005"
    volumes:
      - tablosync-tve-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5005/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  tablosync-tve-data:
